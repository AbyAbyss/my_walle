[[permission]]
identifier = "allow-get-walle-config"
description = "Allows reading walle.config.json via IPC."
commands.allow = ["get_walle_config"]

[[permission]]
identifier = "allow-save-mascot-position"
description = "Allows persisting mascot window position to walle.config.json."
commands.allow = ["save_mascot_position"]

[[permission]]
identifier = "allow-save-workflow-to-config"
description = "Allows persisting workflows to walle.config.json."
commands.allow = ["save_workflow_to_config"]
